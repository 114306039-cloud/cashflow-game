    <style>
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        @keyframes flash-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0); }
            50% { background-color: rgba(239, 68, 68, 0.4); }
        }
        @keyframes projectile-ocf {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(350px, -50px) scale(0.5); opacity: 0; }
        }
        @keyframes projectile-icf {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(350px, -50px) scale(0.5); opacity: 0; }
        }
        @keyframes projectile-fcf {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(350px, -50px) scale(0.5); opacity: 0; }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite ease-in-out;
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 2;
        }
        .animate-flash-red {
            animation: flash-red 0.3s ease-in-out;
        }
        .projectile-ocf-active {
            animation: projectile-ocf 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .projectile-icf-active {
            animation: projectile-icf 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .projectile-fcf-active {
            animation: projectile-fcf 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #050b14;
            color: #f1f5f9;
        }
    </style>
</head>

        // 隨機洗牌函式
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function App() {
            // --- 遊戲狀態 ---
            const [gameState, setGameState] = useState('start'); // 'start', 'playing', 'game_over'
            const [gameQuestions, setGameQuestions] = useState([]); // 當局隨機 10 題
            const [questionIndex, setQuestionIndex] = useState(0);
            const [activeQuestion, setActiveQuestion] = useState(null);
            
            // 戰鬥數據
            const [playerHp, setPlayerHp] = useState(100);
            const [score, setScore] = useState(0);
            const [correctCount, setCorrectCount] = useState(0);

            // 多階段怪獸管理
            const [currentMonsterIndex, setCurrentMonsterIndex] = useState(0);
            const [currentMonsterHp, setCurrentMonsterHp] = useState(100);
            const [defeatedMonsters, setDefeatedMonsters] = useState([]);

            // 動畫及反饋
            const [animationState, setAnimationState] = useState('');
            const [answerFeedback, setAnswerFeedback] = useState(null);
            const [wrongAnswers, setWrongAnswers] = useState([]);

            // AI 導師
            const [aiExplanation, setAiExplanation] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);

            // 初始化新的一局（隨機抽 10 題）
            const startNewSession = () => {
                const shuffled = shuffleArray(MASTER_QUESTIONS);
                const selected = shuffled.slice(0, 10);
                
                setGameQuestions(selected);
                setQuestionIndex(0);
                setActiveQuestion(selected[0]);
                
                setPlayerHp(100);
                setScore(0);
                setCorrectCount(0);
                
                setCurrentMonsterIndex(0);
                setCurrentMonsterHp(BOSS_STAGES[0].maxHp);
                setDefeatedMonsters([]);

                setWrongAnswers([]);
                setAnswerFeedback(null);
                setAiExplanation('');
                setGameState('playing');
            };

            // 核心傷害與Boss切換邏輯
            const dealDamageToBosses = (damageAmount) => {
                let currentHp = currentMonsterHp;
                let monsterIdx = currentMonsterIndex;
                let localDefeated = [...defeatedMonsters];

                let remainingDamage = damageAmount;

                while (remainingDamage > 0 && monsterIdx < BOSS_STAGES.length) {
                    const activeBoss = BOSS_STAGES[monsterIdx];
                    if (currentHp > remainingDamage) {
                        currentHp -= remainingDamage;
                        remainingDamage = 0;
                    } else {
                        // 擊敗當前 Boss
                        remainingDamage -= currentHp;
                        localDefeated.push(activeBoss.name);
                        
                        monsterIdx += 1;
                        if (monsterIdx < BOSS_STAGES.length) {
                            currentHp = BOSS_STAGES[monsterIdx].maxHp;
                        } else {
                            currentHp = 0; // 全部擊殺！
                        }
                    }
                }

                setCurrentMonsterHp(currentHp);
                setCurrentMonsterIndex(monsterIdx);
                setDefeatedMonsters(localDefeated);
            };

            const handleAnswer = (option) => {
                if (answerFeedback) return;

                const isCorrect = option.isCorrect;
                
                if (isCorrect) {
                    setScore(prev => prev + 100);
                    setCorrectCount(prev => prev + 1);
                    
                    // 答對一題造成 40 點高額輸出！
                    dealDamageToBosses(40);

                    if (option.type === "OCF") setAnimationState('projectile-ocf');
                    if (option.type === "ICF") setAnimationState('projectile-icf');
                    if (option.type === "FCF") setAnimationState('projectile-fcf');

                    setAnswerFeedback({
                        isCorrect: true,
                        text: `✨ 魔法詠唱成功！【${option.label}】為正確分類！發射高階飛彈造成 40 點傷害！`,
                        explain: activeQuestion.explain
                    });
                } else {
                    // 答錯扣玩家生命值 (扣 15)
                    setPlayerHp(prev => Math.max(0, prev - 15));
                    setAnimationState('shake-and-flash');

                    setWrongAnswers(prev => [...prev, {
                        question: activeQuestion.text,
                        chosen: option.label,
                        correct: activeQuestion.options.find(o => o.isCorrect).label,
                        explain: activeQuestion.explain
                    }]);

                    setAnswerFeedback({
                        isCorrect: false,
                        text: `💥 分類謬誤！這不是【${option.label}】。遭到怪獸反噬，護盾值受損！`,
                        explain: activeQuestion.explain
                    });
                }

                setTimeout(() => {
                    setAnimationState('');
                }, 800);
            };

            const handleNext = () => {
                const nextIdx = questionIndex + 1;

                // 若 10 題已做完，或是玩家血量歸零，則直接結算
                if (nextIdx >= 10 || playerHp <= 0) {
                    setGameState('game_over');
                } else {
                    setQuestionIndex(nextIdx);
                    setActiveQuestion(gameQuestions[nextIdx]);
                    setAnswerFeedback(null);
                }
            };

            // AI 特訓報告生成
            const askAiTutor = async () => {
                setIsAiLoading(true);
                setAiExplanation('正在連線傳喚會計學大師，正在讀取第七組組員的錯題表現，進行高維度金流觀念特訓剖析...');

                const wrongDetails = wrongAnswers.map((w, idx) => `
                錯題 ${idx+1}：
                會計情境："${w.question}"
                玩家錯判："${w.chosen}"
                正確解答："${w.correct}"
                `).join('\n');

                const systemPrompt = "你是一位幽默熱情、掌握頂尖會計學術理論的『大專會計魔法學院特聘教授』。請用繁體中文 (Traditional Chinese)，針對玩家在此局10題隨機戰中答錯的題型進行破題診斷。用最通俗易懂的語言點醒他們：日常營運（OCF）看損益及營運資金流動；非流動資產買賣（ICF）屬於長期投資；向金融機構借還款或向股東發股利（FCF）則是籌資。字數請精簡在 280 字內，並給予正面鼓勵。";

                try {
                    const apiKey = ""; 
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `第七組本次隨機抽題挑戰的錯題記錄如下：\n${wrongDetails || "全對無錯題，完美過關！請給予極高規格的褒獎！"}\n請大師進行特訓診斷：` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    if (!response.ok) throw new Error();
                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "連線至學院伺服器失敗，但大師的心法仍在：『營運看收支，投資看長資，籌資看股利！』";
                    setAiExplanation(text);
                } catch (error) {
                    setAiExplanation("⚠️ 魔法波段受干擾。大師留言：『記住核心奧義：營運活動 (OCF) 是主要進銷存與流動損益項目；投資活動 (ICF) 是購置長期的機器設備或處分長投；籌資活動 (FCF) 是與銀行借還款或向股東融資與發股利。掌握這些，下次必然能無傷橫掃淨零大魔神！』");
                } finally {
                    setIsAiLoading(false);
                }
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    {/* 團隊頂部抬頭 */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-indigo-950/40">
                                <Icons.Sparkles />
                            </div>
                            <div>
                                <h1 className="text-3xl font-extrabold text-white tracking-wide">
                                    會計魔法戰 
                                </h1>
                                <p className="text-sm text-gray-400">大專會計創意專案：溢出傷害連鎖殺陣，目標斬殺深淵之至高魔龍皇！</p>
                            </div>
                        </div>
                        <div className="mt-4 md:mt-0 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                            <span className="text-gray-400">專案小組：</span>
                            <span className="font-bold text-indigo-400">第七組：陳柔錚、張展睿、王耀陞、郝浚丞、鄭明恩</span>
                        </div>
                    </header>

                    {/* 初始畫面 */}
                    {gameState === 'start' && (
                        <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center my-12 shadow-2xl">
                            <div className="w-20 h-20 bg-red-600/10 text-red-400 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-500/20">
                                <Icons.Flame />
                            </div>
                            <h2 className="text-2xl font-bold mb-3 text-white">啟動：遠古三階魔王連續挑戰賽</h2>
                            <p className="text-sm text-gray-300 leading-relaxed mb-6 text-left">
                                召喚會計魔法師！你將連續迎戰三個階段的中二深淵巨獸！
                                每次答對能造成 <strong>40 點溢出傷害</strong>。10 題答完後，我們將結算你成功斬殺了哪幾隻巨獸、以及最後面對的 Boss 殘留血量！
                                <br /><br />
                                👿 <strong>一階：幽冥虛空噬魂災厄兵</strong>（HP: 100）
                                <br />
                                🪨 <strong>二階：破滅極星黃金泰坦神巨石</strong>（HP: 120）
                                <br />
                                🐲 <strong>三階：至高神耀淨世創生魔龍皇</strong>（HP: 150）
                            </p>
                            <button
                                onClick={startNewSession}
                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-4 px-6 rounded-xl transition duration-150 text-lg flex items-center justify-center gap-2"
                            >
                                <Icons.Shield />
                                隨機抽取 10 題即刻迎戰
                            </button>
                        </div>
                    )}

                    {/* 戰鬥中介面 */}
                    {gameState === 'playing' && activeQuestion && (
                        <div className="space-y-6">
                            
                            {/* 戰鬥動畫展示區 */}
                            <div className={`bg-slate-950 border border-slate-800 rounded-2xl p-6 relative h-64 overflow-hidden transition-all duration-300 ${
                                animationState === 'shake-and-flash' ? 'animate-flash-red animate-shake border-red-500/50' : ''
                            }`}>
                                <div className="absolute inset-0 bg-gradient-to-b from-indigo-950/20 to-transparent pointer-events-none"></div>
                                
                                <div className="absolute top-4 left-4 text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-950/40 px-3 py-1.5 rounded-full border border-indigo-900">
                                    進度：第 {questionIndex + 1} / 10 題
                                </div>

                                <div className="absolute top-4 right-4 text-sm font-bold text-yellow-400">
                                    累計得分：{score} pts
                                </div>

                                <div className="flex justify-between items-center h-full max-w-4xl mx-auto px-4">
                                    {/* 玩家 */}
                                    <div className="flex flex-col items-center relative animate-bounce-slow">
                                        <div className="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-3xl shadow-xl border border-indigo-400">
                                            🧙‍♂️
                                        </div>
                                        <span className="text-xs font-bold mt-2 text-indigo-300">魔法會計師</span>
                                        <div className="w-24 bg-slate-800 h-2.5 rounded-full mt-1.5 overflow-hidden">
                                            <div className="bg-emerald-500 h-full transition-all duration-300" style={{ width: `${playerHp}%` }}></div>
                                        </div>
                                    </div>

                                    {/* 飛彈彈道 */}
                                    <div className="flex items-center justify-center">
                                        {animationState === 'projectile-ocf' && <div className="absolute w-12 h-6 bg-blue-500 rounded-full projectile-ocf-active flex items-center justify-center text-xs font-extrabold text-white">OCF</div>}
                                        {animationState === 'projectile-icf' && <div className="absolute w-12 h-6 bg-emerald-500 rounded-full projectile-icf-active flex items-center justify-center text-xs font-extrabold text-white">ICF</div>}
                                        {animationState === 'projectile-fcf' && <div className="absolute w-12 h-6 bg-amber-500 rounded-full projectile-fcf-active flex items-center justify-center text-xs font-extrabold text-white">FCF</div>}
                                        {animationState === 'shake-and-flash' && <span className="text-3xl animate-pulse">💥</span>}
                                    </div>

                                    {/* 當前目標 Boss */}
                                    <div className="flex flex-col items-center relative">
                                        {currentMonsterIndex < BOSS_STAGES.length ? (
                                            <>
                                                <div className="w-20 h-20 bg-slate-900 border-2 border-red-500 rounded-2xl flex items-center justify-center text-4xl shadow-xl animate-bounce-slow">
                                                    {BOSS_STAGES[currentMonsterIndex].avatar}
                                                </div>
                                                <span className="text-xs font-bold mt-2 text-red-300 truncate max-w-[150px]">
                                                    {BOSS_STAGES[currentMonsterIndex].name}
                                                </span>
                                                <div className="w-28 bg-slate-800 h-2.5 rounded-full mt-1.5 overflow-hidden">
                                                    <div 
                                                        className="bg-red-500 h-full transition-all duration-300" 
                                                        style={{ width: `${(currentMonsterHp / BOSS_STAGES[currentMonsterIndex].maxHp) * 100}%` }}
                                                    ></div>
                                                </div>
                                                <span className="text-[10px] text-gray-500 mt-1">
                                                    HP: {currentMonsterHp} / {BOSS_STAGES[currentMonsterIndex].maxHp}
                                                </span>
                                            </>
                                        ) : (
                                            <div className="text-center">
                                                <div className="text-5xl animate-bounce">👑</div>
                                                <span className="text-xs font-bold text-yellow-400 block mt-2">深淵霸主全數被消滅！</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* 題目面板 */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                                    <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest flex items-center gap-1.5">
                                        <Icons.HelpCircle />
                                        隨機交易事件
                                    </span>
                                    <span className="text-xs text-gray-400">已擊破魔王：{defeatedMonsters.length} / 3</span>
                                </div>
                                <h3 className="text-lg md:text-xl font-bold text-white leading-relaxed mb-6">
                                    「{activeQuestion.text}」
                                </h3>

                                {!answerFeedback ? (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {activeQuestion.options.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleAnswer(opt)}
                                                className={`py-4 px-6 rounded-xl border font-bold text-sm text-white transition duration-150 flex flex-col items-center justify-center gap-2 ${
                                                    opt.type === 'OCF' ? 'bg-slate-950 border-blue-900 hover:border-blue-500 hover:bg-blue-950/20' :
                                                    opt.type === 'ICF' ? 'bg-slate-950 border-emerald-900 hover:border-emerald-500 hover:bg-emerald-950/20' :
                                                    'bg-slate-950 border-amber-900 hover:border-amber-500 hover:bg-amber-950/20'
                                                }`}
                                            >
                                                <span className={`text-xs px-2.5 py-0.5 rounded-full ${
                                                    opt.type === 'OCF' ? 'bg-blue-900/40 text-blue-400' :
                                                    opt.type === 'ICF' ? 'bg-emerald-900/40 text-emerald-400' :
                                                    'bg-amber-900/40 text-amber-400'
                                                }`}>
                                                    {opt.type}
                                                </span>
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className={`p-5 rounded-xl border ${
                                            answerFeedback.isCorrect ? 'bg-emerald-950/20 border-emerald-900 text-emerald-200' : 'bg-rose-950/20 border-rose-900 text-rose-200'
                                        }`}>
                                            <h4 className="font-bold mb-1 flex items-center gap-1.5">
                                                {answerFeedback.isCorrect ? <Icons.CheckCircle /> : <Icons.AlertTriangle />}
                                                <span className="ml-1">{answerFeedback.text}</span>
                                            </h4>
                                            <p className="text-xs text-gray-400 mt-2"><strong>💡 答案理論解析：</strong> {answerFeedback.explain}</p>
                                        </div>
                                        <button
                                            onClick={handleNext}
                                            className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition duration-150 flex items-center justify-center gap-1"
                                        >
                                            下一個事件卡
                                            <Icons.ArrowRight />
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* 遊戲結算畫面 */}
                    {gameState === 'game_over' && (
                        <div className="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                            <div className="text-center mb-6">
                                <div className="w-24 h-24 bg-gradient-to-br from-yellow-500/10 to-indigo-500/10 border border-yellow-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-5xl">
                                    {currentMonsterIndex >= BOSS_STAGES.length ? "🏆" : BOSS_STAGES[currentMonsterIndex].avatar}
                                </div>
                                <h2 className="text-3xl font-extrabold text-white">第七組財務魔法戰鬥報告</h2>
                                <p className="text-sm text-gray-400 mt-1">10 題隨機實力考核完畢，以下為您目前的防禦進度：</p>
                            </div>

                            {/* 戰況盤點面板 */}
                            <div className="bg-slate-950 border border-slate-800 rounded-xl p-5 mb-6 text-center space-y-4">
                                <div>
                                    <span className="text-xs text-gray-500 font-bold uppercase block">當前面對 / 終結狀態</span>
                                    {currentMonsterIndex >= BOSS_STAGES.length ? (
                                        <div className="mt-2">
                                            <span className="text-xl font-black text-emerald-400">👑 神話永續級：完全擊殺！</span>
                                            <p className="text-xs text-gray-400 mt-2 leading-relaxed px-4">
                                                次元主宰！10題中你近乎全對（錯 0~1 題），總輸出高達 360 點以上，成功將實力深不可測的【魔龍皇】徹底降伏，完美守護了手搖飲店的淨零金流！
                                            </p>
                                        </div>
                                    ) : (
                                        <div className="mt-2">
                                            <span className="text-xl font-black text-yellow-400">
                                                正在與 {BOSS_STAGES[currentMonsterIndex].name} 激烈鏖戰！
                                            </span>
                                            <p className="text-sm font-bold text-gray-300 mt-1">
                                                該 Boss 殘餘血量：<span className="text-red-400">{currentMonsterHp}</span> / {BOSS_STAGES[currentMonsterIndex].maxHp}
                                            </p>
                                            <p className="text-xs text-gray-400 mt-3 leading-relaxed px-4">
                                                {currentMonsterIndex === 2 && "錯 2 到 4 題。表現極為優異！你輕鬆橫掃了小魔兵與神巨石，順利攻克至最深淵的第三關，正與【至高神耀魔龍皇】展開最後的終焉對決！"}
                                                {currentMonsterIndex === 1 && "錯 5 到 7 題。稍顯吃力！你成功斬殺了第一關的魔物，目前被第二關的【泰坦神巨石】使用超重力屏障死死壓制！"}
                                                {currentMonsterIndex === 0 && "錯 8 題以上。警告！你的魔法詠唱不夠精準，目前仍被阻擋在最弱的【幽冥虛空小魔兵】面前，手搖飲店將陷入不可逆的流動性赤字黑洞！"}
                                            </p>
                                        </div>
                                    )}
                                </div>

                                <div className="border-t border-slate-800 pt-4 text-left">
                                    <span className="text-xs text-gray-500 font-bold block mb-2">已成功斬殺的 Boss 清單：</span>
                                    {defeatedMonsters.length > 0 ? (
                                        <div className="flex flex-wrap gap-2">
                                            {defeatedMonsters.map((name, i) => (
                                                <span key={i} className="text-xs font-bold bg-red-950/40 border border-red-900/60 text-red-400 py-1 px-3 rounded-full">
                                                    🪓 已斬殺：{name}
                                                </span>
                                            ))}
                                        </div>
                                    ) : (
                                        <span className="text-xs text-gray-500 italic">無（尚未成功討伐任何 Boss）</span>
                                    )}
                                </div>
                            </div>

                            {/* 分數與失誤 */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs text-gray-500 font-bold block">答對題數 (正確率)</span>
                                    <span className="text-2xl font-black text-emerald-400 mt-1 inline-block">{correctCount} / 10 題</span>
                                </div>
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs text-gray-500 font-bold block">最終魔法積分</span>
                                    <span className="text-2xl font-black text-indigo-400 mt-1 inline-block">{score} pts</span>
                                </div>
                            </div>

                            {/* AI 特訓導師 */}
                            <div className="bg-gradient-to-r from-indigo-950/40 to-slate-950 border border-indigo-900 rounded-2xl p-5 shadow-xl mb-6">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-sm font-bold text-indigo-300 flex items-center gap-1">
                                        <Icons.Sparkles /> <span>Gemini AI 導師之第七組戰功評估</span>
                                    </h3>
                                    <button
                                        onClick={askAiTutor}
                                        disabled={isAiLoading}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-1.5 px-3 rounded-lg flex items-center gap-1 transition duration-150"
                                    >
                                        {isAiLoading ? <span className="animate-spin inline-block w-3 h-3 border-2 border-white border-t-transparent rounded-full mr-1"></span> : <Icons.BookOpen />}
                                        <span>大師觀念診斷</span>
                                    </button>
                                </div>
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs min-h-[90px]">
                                    {aiExplanation ? (
                                        <p className="text-indigo-200 leading-relaxed whitespace-pre-line font-mono">{aiExplanation}</p>
                                    ) : (
                                        <p className="text-gray-500 italic text-center py-2">
                                            {wrongAnswers.length > 0 ? "「點擊大師診斷，AI 會立刻調閱第七組本次錯題，精準傳授應對巨獸的會計核心心法！」" : "「太完美了！無失誤通關，點擊大師診斷，聆聽大師對第七組的最高讚賞！」"}
                                        </p>
                                    )}
                                </div>
                            </div>

                            <button
                                onClick={startNewSession}
                                className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl transition duration-150 flex justify-center items-center gap-1"
                            >
                                <Icons.RotateCcw />
                                <span>重啟新挑戰（再次隨機抽 10 題）</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
