<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會計魔法戰：現金流三大活動防禦戰</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        @keyframes flash-red {
            0%, 100% { background-color: rgba(239, 68, 68, 0); }
            50% { background-color: rgba(239, 68, 68, 0.4); }
        }
        @keyframes projectile-ocf {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(350px, -50px) scale(0.5); opacity: 0; }
        }
        @keyframes projectile-icf {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(350px, -50px) scale(0.5); opacity: 0; }
        }
        @keyframes projectile-fcf {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(350px, -50px) scale(0.5); opacity: 0; }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite ease-in-out;
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 2;
        }
        .animate-flash-red {
            animation: flash-red 0.3s ease-in-out;
        }
        .projectile-ocf-active {
            animation: projectile-ocf 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .projectile-icf-active {
            animation: projectile-icf 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .projectile-fcf-active {
            animation: projectile-fcf 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #050b14;
            color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div id="root" class="flex-grow"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom Inline SVGs to avoid Lucide DOM conflicts and React crashes
        const Icons = {
            Sparkles: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-indigo-400"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275Z"/><path d="m5 3 1 2.5L8.5 6 6 7 5 9.5 4 7 1.5 6 4 5.5Z"/><path d="m19 17 1 2.5 2.5.5-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z"/></svg>
            ),
            Flame: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-10 h-10"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
            ),
            Shield: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2A1 1 0 0 1 20 6z"/></svg>
            ),
            HelpCircle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            ),
            CheckCircle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-emerald-400"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            ),
            AlertTriangle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 text-rose-400"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            ),
            ArrowRight: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            ),
            ShieldCheck: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-12 h-12"><path d="M20 13c0 5-3.5 7.5-7.66 9.7a1 1 0 0 1-.68 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 .76-.97l8-2a1 1 0 0 1 .48 0l8 2A1 1 0 0 1 20 6z"/><path d="m9 12 2 2 4-4"/></svg>
            ),
            Sword: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/></svg>
            ),
            Trophy: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-12 h-12"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34"/><path d="M12 2a6 6 0 0 1 6 6v3.5c0 1.62-1.38 3-3 3H9c-1.62 0-3-1.38-3-3V8a6 6 0 0 1 6-6z"/></svg>
            ),
            BookOpen: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            ),
            RotateCcw: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><polyline points="3 3 3 8 8 8"/></svg>
            )
        };

        // Level Question Database
        const QUESTIONS = [
            // LEVEL 1: Basics
            {
                id: 1,
                level: 1,
                text: "顧客來店點餐，支付現金 $150 購買招牌珍珠鮮奶茶。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: true },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: false },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "這是手搖飲店主要的營業活動。銷售商品取得現金流入屬於營運活動 (OCF)。"
            },
            {
                id: 2,
                level: 1,
                text: "店鋪花費現金 $120,000 購置一台全新的「全自動封口包裝機」。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: false },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: true },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "購買供營業使用之非流動資產（機器設備、不動產等）屬於投資活動 (ICF)。"
            },
            {
                id: 3,
                level: 1,
                text: "因為初期營運資金不足，向合作金庫銀行申請長期擔保借款 $500,000。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: false },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: false },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: true }
                ],
                explain: "向銀行借入長期款項，屬於與債權人交易，屬於籌資活動 (FCF) 的現金流入。"
            },
            
            // LEVEL 2: Moderate (Accrual & Working Capital changes)
            {
                id: 4,
                level: 2,
                text: "支付本月份員工薪水、店面租金與固定水電費共 $45,000。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: true },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: false },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "支付員工薪資、房租等屬於日常營運費用，屬於營運活動 (OCF) 的現金流出。"
            },
            {
                id: 5,
                level: 2,
                text: "收回上個月大專迎新活動中，資產負債表上所記錄的「應收帳款」現金 $35,000。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: true },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: false },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "應收帳款的收回雖然不影響損益表，但它是日常銷售產生的營運資金變動，屬於營運活動 (OCF)。"
            },
            {
                id: 6,
                level: 2,
                text: "決定將舊有的中古外送機車處分淘汰，取得出售現金 $18,000。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: false },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: true },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "出售非流動資產（機器、設備、土地、車輛等）取得的現金流入，屬於投資活動 (ICF)。"
            },

            // LEVEL 3: Advanced Challenge (Interests, Dividends, Adjustments)
            {
                id: 7,
                level: 3,
                text: "年度結束時，依照股東大會決議，發放現金股利 $80,000 給店鋪股東。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: false },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: false },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: true }
                ],
                explain: "支付股利屬於回饋給出資股東，屬於籌資活動 (FCF) 的現金流出。（台灣常規做法與IFRS分類）"
            },
            {
                id: 8,
                level: 3,
                text: "償付銀行長期貸款的利息支出 $5,000。 (採用IFRS常規分類)",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: true },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: false },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "在IFRS架構下，支付利息可分類為營運活動（以反映本期損益影響）或籌資活動。台灣企業實務一般將支付利息歸類為「營運活動 (OCF)」。"
            },
            {
                id: 9,
                level: 3,
                text: "將閒置資金購入台積電公司股票作為長期投資，支付交割現金 $200,000。",
                options: [
                    { label: "營運活動 (OCF)", type: "OCF", isCorrect: false },
                    { label: "投資活動 (ICF)", type: "ICF", isCorrect: true },
                    { label: "籌資活動 (FCF)", type: "FCF", isCorrect: false }
                ],
                explain: "購買其他企業之股票、債券等金融資產作為長期投資目的，屬於投資活動 (ICF) 的現金流出。"
            }
        ];

        function App() {
            // --- GAME STATES ---
            const [gameState, setGameState] = useState('start'); // 'start', 'playing', 'level_clear', 'game_over'
            const [currentLevel, setCurrentLevel] = useState(1);
            const [score, setScore] = useState(0);
            
            // Battle Stats
            const [playerHp, setPlayerHp] = useState(100);
            const [enemyHp, setEnemyHp] = useState(100);
            const [enemyMaxHp, setEnemyMaxHp] = useState(100);
            const [enemyName, setEnemyName] = useState('高碳排赤字小魔兵');

            // Current Active Question Index for current level
            const [questionIndex, setQuestionIndex] = useState(0);
            const [activeQuestion, setActiveQuestion] = useState(null);

            // Animations and feedback
            const [animationState, setAnimationState] = useState(''); // 'shake-and-flash', 'projectile-ocf', etc.
            const [answerFeedback, setAnswerFeedback] = useState(null); // { isCorrect: true, explain: "" }
            const [wrongAnswers, setWrongAnswers] = useState([]); // Track wrong ones for AI feedback

            // AI Help Advisor
            const [aiExplanation, setAiExplanation] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);

            // Set up level enemies and questions
            const initLevel = (lvl) => {
                setCurrentLevel(lvl);
                setQuestionIndex(0);
                
                // Set enemy difficulty
                if (lvl === 1) {
                    setEnemyName('初階：高碳排赤字魔兵');
                    setEnemyHp(100);
                    setEnemyMaxHp(100);
                } else if (lvl === 2) {
                    setEnemyName('中階：非流動折舊巨石怪');
                    setEnemyHp(120);
                    setEnemyMaxHp(120);
                } else {
                    setEnemyName('終極：IFRS 利息混合大魔王');
                    setEnemyHp(150);
                    setEnemyMaxHp(150);
                }

                const filtered = QUESTIONS.filter(q => q.level === lvl);
                setActiveQuestion(filtered[0]);
                setAnswerFeedback(null);
                setAiExplanation('');
            };

            const startGame = () => {
                setScore(0);
                setPlayerHp(100);
                setWrongAnswers([]);
                initLevel(1);
                setGameState('playing');
            };

            const handleAnswer = (option) => {
                if (answerFeedback) return; // Prevent double submission before next

                const isCorrect = option.isCorrect;
                
                if (isCorrect) {
                    // Correct! Launch magic attack
                    setScore(prev => prev + 100);
                    // Use Math.ceil to make sure 3 correct answers reduce HP perfectly to 0
                    const damage = Math.ceil(enemyMaxHp / 3); 
                    setEnemyHp(prev => Math.max(0, prev - damage));
                    
                    // Trigger attack animation based on answer type
                    if (option.type === "OCF") setAnimationState('projectile-ocf');
                    if (option.type === "ICF") setAnimationState('projectile-icf');
                    if (option.type === "FCF") setAnimationState('projectile-fcf');

                    setAnswerFeedback({
                        isCorrect: true,
                        text: `✨ 魔法吟唱成功！【${option.label}】是正確分類！發射強力魔法彈攻擊對手！`,
                        explain: activeQuestion.explain
                    });

                    setTimeout(() => {
                        setAnimationState('');
                    }, 1000);

                } else {
                    // Incorrect! Monster counter-attacks
                    setPlayerHp(prev => Math.max(0, prev - 25));
                    setAnimationState('shake-and-flash');

                    // Record wrong answer to let AI analyze later
                    setWrongAnswers(prev => [...prev, {
                        question: activeQuestion.text,
                        chosen: option.label,
                        correct: activeQuestion.options.find(o => o.isCorrect).label,
                        explain: activeQuestion.explain
                    }]);

                    setAnswerFeedback({
                        isCorrect: false,
                        text: `💥 吟唱失敗！這不是【${option.label}】。遭到對手強力反擊！`,
                        explain: activeQuestion.explain
                    });

                    setTimeout(() => {
                        setAnimationState('');
                    }, 1000);
                }
            };

            const handleNext = () => {
                // If player is dead, Game Over
                if (playerHp <= 0) {
                    setGameState('game_over');
                    return;
                }

                const levelQuestions = QUESTIONS.filter(q => q.level === currentLevel);
                const nextIdx = questionIndex + 1;

                // Check if the enemy is fully defeated (HP = 0)
                if (enemyHp <= 0) {
                    if (currentLevel < 3) {
                        setGameState('level_clear');
                    } else {
                        setGameState('game_over'); // Won the whole game
                    }
                } else {
                    // If we have run out of questions for this level but the enemy is STILL alive
                    // (Meaning the player made mistakes and did not deal enough damage)
                    if (nextIdx >= levelQuestions.length) {
                        // Player fails to clear the level because monster did not die
                        setGameState('game_over');
                    } else {
                        // Move to the next question in the current level
                        setQuestionIndex(nextIdx);
                        setActiveQuestion(levelQuestions[nextIdx]);
                        setAnswerFeedback(null);
                    }
                }
            };

            const enterNextLevel = () => {
                initLevel(currentLevel + 1);
                setGameState('playing');
            };

            // --- GEMINI API CALL FOR WRONG QUESTION ANALYSIS ---
            const askAiTutor = async () => {
                setIsAiLoading(true);
                setAiExplanation('正在連線傳喚會計學大師，為您批改考卷並傳授三大活動分類奧義...');

                const wrongDetails = wrongAnswers.map((w, idx) => `
                錯題 ${idx+1}：
                問題："${w.question}"
                您誤判為："${w.chosen}"
                正確答案："${w.correct}"
                `).join('\n');

                const systemPrompt = "你是一位熱情且會計理論極強的『大專會計魔法學院特聘教授』。請用繁體中文 (Traditional Chinese)，針對玩家在『現金流量表三大活動』分類挑戰中答錯的題目進行精闢且極易理解的「破題解析與觀念導正」。請教導玩家如何區分營運活動 (OCF)、投資活動 (ICF) 與籌資活動 (FCF) 的最核心邏輯（例如：營運看損益與流動資產負債、投資看非流動資產、籌資看非流動負債與權益）。字數控制在 250 字內，用活潑幽默且鼓勵性質的口吻撰寫。";

                try {
                    const apiKey = ""; 
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `玩家在挑戰賽中的錯題記錄如下：\n${wrongDetails || "無錯題，玩家全部答對！請給予大力的讚賞與後續學習建議。"}\n請為玩家進行觀念診斷與魔鬼訓練教學：` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    if (!response.ok) throw new Error();

                    const result = await response.json();
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "連線至魔法學院失敗，但會計大師留下了一句真傳密碼：『營運看損益，投資看長投，籌資看金主！』";
                    setAiExplanation(text);
                } catch (error) {
                    setAiExplanation("⚠️ 魔法電訊中斷。大師留言：『記住！營運活動 (OCF) 是日常進銷存；投資活動 (ICF) 是購置長期的不動產、廠房及設備；籌資活動 (FCF) 是跟銀行借還款或向股東融資與發股利。掌握此原則，即可輕鬆擊敗赤字怪獸！』");
                } finally {
                    setIsAiLoading(false);
                }
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-8">
                    {/* Top Status Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-indigo-950/40">
                                <Icons.Sparkles />
                            </div>
                            <div>
                                <h1 className="text-3xl font-extrabold text-white tracking-wide">
                                    會計魔法戰 <span className="text-xs bg-indigo-700 text-indigo-100 py-1 px-3 rounded-full uppercase tracking-widest font-bold">現金流防禦戰</span>
                                </h1>
                                <p className="text-sm text-gray-400">大專會計創意專案：精通營運 (OCF)、投資 (ICF) 與籌資 (FCF) 三大活動分類</p>
                            </div>
                        </div>
                        <div className="mt-4 md:mt-0 bg-slate-900 border border-slate-800 px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                            <span className="text-gray-400">專案小組：</span>
                            <span className="font-bold text-indigo-400">第七組：陳柔錚、張展睿、王耀陞、郝浚丞、鄭明恩</span>
                        </div>
                    </header>

                    {/* START SCREEN */}
                    {gameState === 'start' && (
                        <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center my-12 shadow-2xl">
                            <div className="w-20 h-20 bg-indigo-600/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-6 border border-indigo-500/20">
                                <Icons.Flame />
                            </div>
                            <h2 className="text-2xl font-bold mb-3 text-white">召喚：會計魔法師！</h2>
                            <p className="text-sm text-gray-300 leading-relaxed mb-6 text-left">
                                「高碳排赤字怪獸」正在侵蝕我們的校園手搖飲店財務。唯一的防禦武器，就是將突發的會計交易正確歸類到現金流量表深度三大核心活動：
                                <br /><br />
                                🔵 <strong>營運活動 (OCF)</strong>：所有跟日常賺錢與開銷相關的收支。
                                <br />
                                🟢 <strong>投資活動 (ICF)</strong>：添購生產力設備或做長期投資。
                                <br />
                                🟡 <strong>籌資活動 (FCF)</strong>：跟銀行借還錢或給股東發放股利。
                                <br /><br />
                                答對即可發射強力會計導彈擊退怪獸，答錯則會遭受重大財務反噬！你有信心能完全擊退三大關卡的惡麻嗎？
                            </p>
                            <button
                                onClick={startGame}
                                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-4 px-6 rounded-xl transition duration-150 text-lg flex items-center justify-center gap-2"
                            >
                                <Icons.Shield />
                                進入魔法試煉
                            </button>
                        </div>
                    )}

                    {/* BATTLEGROUND AREA */}
                    {gameState === 'playing' && activeQuestion && (
                        <div className="space-y-6">
                            
                            {/* Battle Animation Canvas */}
                            <div className={`bg-slate-950 border border-slate-800 rounded-2xl p-6 relative h-64 overflow-hidden transition-all duration-300 ${
                                animationState === 'shake-and-flash' ? 'animate-flash-red animate-shake border-red-500/50' : ''
                            }`}>
                                <div className="absolute inset-0 bg-gradient-to-b from-indigo-950/20 to-transparent pointer-events-none"></div>
                                
                                <div className="absolute top-4 left-4 text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-950/40 px-3 py-1.5 rounded-full border border-indigo-900">
                                    第 {currentLevel} 關關卡：{enemyName}
                                </div>

                                <div className="absolute top-4 right-4 text-sm font-bold text-yellow-400">
                                    得分：{score} pts
                                </div>

                                {/* Active Combatants Row */}
                                <div className="flex justify-between items-center h-full max-w-4xl mx-auto px-4">
                                    
                                    {/* Player (Wizard) */}
                                    <div className="flex flex-col items-center relative animate-bounce-slow">
                                        <div className="w-16 h-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-3xl shadow-xl shadow-indigo-950/50 border border-indigo-400">
                                            🧙‍♂️
                                        </div>
                                        <span className="text-xs font-bold mt-2 text-indigo-300">魔法會計師</span>
                                        
                                        {/* HP Bar */}
                                        <div className="w-24 bg-slate-800 h-2.5 rounded-full mt-2 overflow-hidden border border-slate-700">
                                            <div className="bg-emerald-500 h-full transition-all duration-300" style={{ width: `${playerHp}%` }}></div>
                                        </div>
                                        <span className="text-[10px] text-gray-500 mt-1">生命值：{playerHp}/100</span>

                                        {/* Magic missile dynamic projectiles */}
                                        {animationState === 'projectile-ocf' && (
                                            <div className="absolute w-12 h-6 bg-blue-500 rounded-full blur-[2px] projectile-ocf-active flex items-center justify-center text-xs font-extrabold text-white">
                                                OCF
                                            </div>
                                        )}
                                        {animationState === 'projectile-icf' && (
                                            <div className="absolute w-12 h-6 bg-emerald-500 rounded-full blur-[2px] projectile-icf-active flex items-center justify-center text-xs font-extrabold text-white">
                                                ICF
                                            </div>
                                        )}
                                        {animationState === 'projectile-fcf' && (
                                            <div className="absolute w-12 h-6 bg-amber-500 rounded-full blur-[2px] projectile-fcf-active flex items-center justify-center text-xs font-extrabold text-white">
                                                FCF
                                            </div>
                                        )}
                                    </div>

                                    {/* CLASH IMPACT ZONE */}
                                    <div className="flex items-center justify-center">
                                        {animationState === 'shake-and-flash' && (
                                            <span className="text-3xl animate-pulse">💥</span>
                                        )}
                                    </div>

                                    {/* Enemy (Monster) */}
                                    <div className="flex flex-col items-center relative">
                                        <div className="w-20 h-20 bg-slate-900 border-2 border-rose-500 rounded-2xl flex items-center justify-center text-4xl shadow-xl shadow-rose-950/40 animate-bounce-slow">
                                            {currentLevel === 1 ? '👹' : currentLevel === 2 ? '🪨' : '🐲'}
                                        </div>
                                        <span className="text-xs font-bold mt-2 text-rose-300">{enemyName}</span>

                                        {/* Enemy HP Bar */}
                                        <div className="w-28 bg-slate-800 h-2.5 rounded-full mt-2 overflow-hidden border border-slate-700">
                                            <div className="bg-rose-500 h-full transition-all duration-300" style={{ width: `${(enemyHp / enemyMaxHp) * 100}%` }}></div>
                                        </div>
                                        <span className="text-[10px] text-gray-500 mt-1">生命值：{enemyHp}/{enemyMaxHp}</span>
                                    </div>

                                </div>
                            </div>

                            {/* Question Card Display */}
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                                    <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest flex items-center gap-1.5">
                                        <Icons.HelpCircle />
                                        會計交易事件
                                    </span>
                                    <span className="text-xs text-gray-500">當前關卡題量：{questionIndex + 1} / 3</span>
                                </div>
                                <h3 className="text-lg md:text-xl font-bold text-white leading-relaxed mb-6">
                                    「{activeQuestion.text}」
                                </h3>

                                {/* Answer Selections */}
                                {!answerFeedback ? (
                                    <div className="grid className inline-grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {activeQuestion.options.map((opt, i) => (
                                            <button
                                                key={i}
                                                onClick={() => handleAnswer(opt)}
                                                className={`py-4 px-6 rounded-xl border font-bold text-sm text-white transition duration-150 flex flex-col items-center justify-center gap-2 ${
                                                    opt.type === 'OCF' ? 'bg-slate-950 border-blue-900 hover:border-blue-500 hover:bg-blue-950/20' :
                                                    opt.type === 'ICF' ? 'bg-slate-950 border-emerald-900 hover:border-emerald-500 hover:bg-emerald-950/20' :
                                                    'bg-slate-950 border-amber-900 hover:border-amber-500 hover:bg-amber-950/20'
                                                }`}
                                            >
                                                <span className={`text-xs px-2.5 py-0.5 rounded-full ${
                                                    opt.type === 'OCF' ? 'bg-blue-900/40 text-blue-400' :
                                                    opt.type === 'ICF' ? 'bg-emerald-900/40 text-emerald-400' :
                                                    'bg-amber-900/40 text-amber-400'
                                                }`}>
                                                    {opt.type}
                                                </span>
                                                {opt.label}
                                            </button>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        <div className={`p-5 rounded-xl border ${
                                            answerFeedback.isCorrect ? 'bg-emerald-950/20 border-emerald-900 text-emerald-200' : 'bg-rose-950/20 border-rose-900 text-rose-200'
                                        }`}>
                                            <h4 className="font-bold mb-2 text-md flex items-center gap-1.5">
                                                {answerFeedback.isCorrect ? (
                                                    <><Icons.CheckCircle /> <span className="ml-1">{answerFeedback.text}</span></>
                                                ) : (
                                                    <><Icons.AlertTriangle /> <span className="ml-1">{answerFeedback.text}</span></>
                                                )}
                                            </h4>
                                            <p className="text-xs text-gray-400 leading-relaxed mt-3">
                                                <strong>💡 會計解析：</strong> {answerFeedback.explain}
                                            </p>
                                        </div>

                                        <button
                                            onClick={handleNext}
                                            className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl transition duration-150 flex items-center justify-center gap-1"
                                        >
                                            繼續前行 / 進入下一回合
                                            <Icons.ArrowRight />
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* LEVEL CLEAR TRANSITION SCREEN */}
                    {gameState === 'level_clear' && (
                        <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center my-12 shadow-2xl">
                            <div className="w-20 h-20 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-6 border border-emerald-500/20">
                                <Icons.ShieldCheck />
                            </div>
                            <h2 className="text-2xl font-bold mb-2 text-white">第 {currentLevel} 關防禦成功！</h2>
                            <p className="text-sm text-gray-400 mb-6">
                                幹得好！你成功利用優異的會計分類，全數擊退了【{enemyName}】。
                                接下來的關卡，赤字怪獸將會更加難纏，會計交易分錄也將引入更複雜的「折舊攤銷」、「應計變動項目」！
                            </p>
                            <button
                                onClick={enterNextLevel}
                                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-6 rounded-xl transition duration-150 flex justify-center items-center gap-2"
                            >
                                <Icons.Sword />
                                挺進第 {currentLevel + 1} 關卡
                            </button>
                        </div>
                    )}

                    {/* GAME OVER AND RESULT COMPILATION */}
                    {gameState === 'game_over' && (
                        <div className="max-w-3xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="w-20 h-20 bg-indigo-600/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                                    <Icons.Trophy />
                                </div>
                                <h2 className="text-3xl font-extrabold text-white">會計魔法試煉總結</h2>
                                <p className="text-gray-400 mt-1">
                                    {playerHp > 0 && enemyHp <= 0 ? '🏆 恭喜！您已成功擊退所有赤字巨獸，榮登「永續金流大師」寶座！' : '💀 挑戰失敗！未能成功擊潰怪獸，店鋪面臨流動性危機！'}
                                </p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div className="bg-slate-950 p-6 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs text-gray-500 uppercase font-bold block">最終魔法積分</span>
                                    <span className="text-4xl font-extrabold text-indigo-400 mt-2 inline-block">{score} pts</span>
                                </div>
                                <div className="bg-slate-950 p-6 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs text-gray-500 uppercase font-bold block">錯題失誤數</span>
                                    <span className="text-4xl font-extrabold text-rose-400 mt-2 inline-block">{wrongAnswers.length} 題</span>
                                </div>
                            </div>

                            {/* AI Magic Accounting Tutor Room */}
                            <div className="bg-gradient-to-r from-indigo-950/50 to-slate-950 border border-indigo-900 rounded-2xl p-6 shadow-xl mb-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-md font-bold text-indigo-300 flex items-center gap-2">
                                        <Icons.Sparkles />
                                        <span className="ml-1">Gemini AI 魔法導師 - 分類奧義特訓診斷</span>
                                    </h3>
                                    <button
                                        onClick={askAiTutor}
                                        disabled={isAiLoading}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2 px-4 rounded-lg flex items-center gap-1.5 transition duration-150"
                                    >
                                        {isAiLoading ? (
                                            <span className="animate-spin inline-block w-3 h-3 border-2 border-white border-t-transparent rounded-full mr-1"></span>
                                        ) : (
                                            <Icons.BookOpen />
                                        )}
                                        <span className="ml-1">大師觀念診斷</span>
                                    </button>
                                </div>
                                <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 text-sm min-h-[100px]">
                                    {aiExplanation ? (
                                        <p className="text-indigo-100 leading-relaxed font-mono whitespace-pre-line">{aiExplanation}</p>
                                    ) : (
                                        <p className="text-gray-500 italic text-center py-4">
                                            {wrongAnswers.length > 0 
                                                ? "「點擊上方大師診斷，AI 導師將精確讀取您在遊戲中答錯的題目，為您量身打造觀念解鎖對策！」"
                                                : "「您太棒了！無失誤通關，點擊上方可獲取大師對您的永續經營祝福語與高級會計展望！」"}
                                        </p>
                                    )}
                                </div>
                            </div>

                            <button
                                onClick={startGame}
                                className="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-xl transition duration-150 flex justify-center items-center gap-2"
                            >
                                <Icons.RotateCcw />
                                <span className="ml-1">重啟修煉 (再次挑戰)</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // Render React Application
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
